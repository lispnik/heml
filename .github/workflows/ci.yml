# Builds Heml on GitHub's macOS runner, drives both of its macOS
# frontends end to end, and builds Heml.app and its disk image, signed ad
# hoc.  Signed, notarised releases are release.yml's job.
#
# The runner has a window server -- GitHub's macOS images come with a
# logged-in session -- which is what lets `make smoke` open the Cocoa
# editor, drive it with real NSEvents and picture every step.  The pictures
# are kept as an artifact: they are what to look at when a run is green but
# something is wrong, since a check says what the editor holds and only a
# picture says what it drew.  `make smoke-tty` runs the TTY backend in tmux,
# and `make smoke-tty-ecl` does the same under ECL.  `make smoke-lsp` asks each
# language server Homebrew has about a small project of its language.
#
# This uses Homebrew's SBCL, whose runtime links libzstd, so the bundle
# built here is fine to test and not distributable; `make check-app` says so
# without failing.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install SBCL, ECL, libfixposix, tmux, tree-sitter and Free Pascal
        run: brew install sbcl ecl libfixposix tmux tree-sitter tree-sitter-python fpc

      - name: Install and configure ocicl
        run: |
          # Each step gets a watchdog and three attempts: a hang here must
          # fail fast and try again rather than eat the run.  macOS ships no
          # timeout(1), hence the watchdog.
          attempt_with_timeout() {
            local secs=$1; shift
            ( "$@" ) & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local watchdog=$!
            local rc=0; wait "$pid" || rc=$?
            kill -9 "$watchdog" 2>/dev/null || true
            return $rc
          }
          clone_ocicl() {
            rm -rf "$HOME/ocicl-src"
            # Outside the repository, so as not to collide with its ocicl/.
            git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          }
          setup_ocicl() {
            ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          }
          for attempt in 1 2 3; do
            if attempt_with_timeout 300 clone_ocicl && attempt_with_timeout 300 setup_ocicl; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::ocicl could not be installed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::ocicl install attempt $attempt failed or hung; retrying"
            sleep 15
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Every sbcl the Makefile starts finds the dependencies through
          # this, as it does on a developer's machine.
          "$HOME/.local/bin/ocicl" setup > "$HOME/.sbclrc"
          "$HOME/.local/bin/ocicl" setup > "$HOME/.eclrc"

      - name: Restore dependencies
        run: |
          # ocicl exits 0 when a download fails, and ghcr.io fails often
          # enough to matter; so several attempts, and a failure here, on
          # the line that names the package.
          for attempt in 1 2 3 4 5; do
            ocicl install 2>&1 | tee ocicl-install.log
            if ! grep -q "failed to install" ocicl-install.log; then
              break
            fi
            echo "::warning::ocicl install attempt $attempt did not get every package"
            sleep 30
          done
          if grep -q "failed to install" ocicl-install.log; then
            echo "::error::ocicl could not install every dependency after 5 attempts" >&2
            exit 1
          fi

      - name: Report the environment
        run: |
          sbcl --version
          sw_vers
          sbcl --noinform --non-interactive \
            --eval '(asdf:load-system :heml.cocoa)' \
            --eval '(format t "~&window server: ~A~%" (objc.runloop:window-server-p))'

      - name: Build the tree-sitter grammars (make tree-sitter)
        run: make tree-sitter

      - name: Drive the Cocoa editor (make smoke)
        run: make smoke

      - name: Drive the TTY editor in tmux (make smoke-tty)
        run: make smoke-tty

      - name: Drive the TTY editor under ECL (make smoke-tty-ecl)
        run: make smoke-tty-ecl

      # The servers Homebrew has; Pascal's, pasls, is built from source with
      # Lazarus, and is left to the stand-in the other tests use.  clangd is
      # Xcode's, and the runner has Rust, Go and Node.
      - name: Install the language servers
        run: |
          brew install rust-analyzer gopls typescript-language-server \
               vscode-langservers-extracted yaml-language-server \
               bash-language-server shellcheck basedpyright
          command -v go || brew install go
          command -v cargo || brew install rust

      - name: Ask each language server about a project (make smoke-lsp)
        run: make smoke-lsp
        env:
          SMOKE_LSP_STRICT: 1

      - name: Build Heml.app and check it
        run: make check-app

      - name: Run the app's command from a shell (make smoke-cli)
        run: make smoke-cli

      - name: Build the disk image
        run: make dmg

      - name: Start Heml.app and quit it
        run: |
          open build/Heml.app
          for i in $(seq 1 60); do
            pgrep -f "Heml.app/Contents/MacOS/heml" >/dev/null && break
            sleep 1
          done
          pgrep -f "Heml.app/Contents/MacOS/heml" >/dev/null || { echo "::error::Heml.app did not start"; exit 1; }
          sleep 5
          # Quit asks the editor, which exits as C-x C-c does; AppKit's own
          # terminate is cancelled, so osascript reports "User canceled".
          osascript -e 'tell application id "org.lispnik.heml" to quit' || true
          for i in $(seq 1 30); do
            pgrep -f "Heml.app/Contents/MacOS/heml" >/dev/null || exit 0
            sleep 1
          done
          echo "::error::Heml.app did not quit"; exit 1

      - name: Verify the disk image
        run: hdiutil verify dist/Heml-*.dmg

      - name: Keep the pictures and the disk image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heml-${{ github.sha }}
          path: |
            build/smoke/*.png
            dist/Heml-*.dmg
          if-no-files-found: warn
